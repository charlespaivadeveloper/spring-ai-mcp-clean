apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: person-postgres-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spring-ai-mcp.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresql.person.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: person-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: person-postgres
    {{- include "spring-ai-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: person-postgres
  template:
    metadata:
      labels:
        app: person-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.person.db }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: person-db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: person-db-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgresql.person.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.secrets.postgresql.personUsername | quote }}, "-d", {{ .Values.postgresql.person.db | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: person-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: person-postgres-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spring-ai-mcp.labels" . | nindent 4 }}
spec:
  selector:
    app: person-postgres
  ports:
    - port: 5432
      targetPort: 5432
