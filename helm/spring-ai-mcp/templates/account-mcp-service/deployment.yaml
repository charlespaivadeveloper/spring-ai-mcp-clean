apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-mcp-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: account-mcp-service
    version: {{ .Values.global.imageTag | quote }}
    {{- include "spring-ai-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-mcp-service
  template:
    metadata:
      labels:
        app: account-mcp-service
        version: {{ .Values.global.imageTag | quote }}
    spec:
      containers:
        - name: account-mcp-service
          image: {{ .Values.global.imageRegistry }}/account-mcp-service:{{ .Values.global.imageTag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.accountMcpService.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://account-postgres-svc:5432/{{ .Values.postgresql.account.db }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: account-db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: account-db-password
          resources:
            {{- toYaml .Values.accountMcpService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.accountMcpService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.accountMcpService.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: account-mcp-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spring-ai-mcp.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: account-mcp-service
  ports:
    - port: {{ .Values.accountMcpService.port }}
      targetPort: {{ .Values.accountMcpService.port }}
      nodePort: {{ .Values.accountMcpService.nodePort }}
