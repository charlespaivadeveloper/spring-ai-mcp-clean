{{- if .Values.kong.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-ai-mcp-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spring-ai-mcp.labels" . | nindent 4 }}
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: rate-limiting,correlation-id,prometheus
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: sample-client-svc
                port:
                  number: {{ .Values.sampleClient.port }}
          - path: /person-mcp
            pathType: Prefix
            backend:
              service:
                name: person-mcp-svc
                port:
                  number: {{ .Values.personMcpService.port }}
          - path: /account-mcp
            pathType: Prefix
            backend:
              service:
                name: account-mcp-svc
                port:
                  number: {{ .Values.accountMcpService.port }}
{{- end }}
