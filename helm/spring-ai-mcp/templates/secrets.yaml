apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spring-ai-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  person-db-username: {{ .Values.secrets.postgresql.personUsername | quote }}
  person-db-password: {{ .Values.secrets.postgresql.personPassword | quote }}
  account-db-username: {{ .Values.secrets.postgresql.accountUsername | quote }}
  account-db-password: {{ .Values.secrets.postgresql.accountPassword | quote }}
{{- if ne (.Values.sampleClient.aiProvider | default "openai") "ollama" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spring-ai-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.secrets.openai.apiKey | quote }}
{{- end }}
